spring.application.name=gestion-universitaire-backend

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_universitaire?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT
jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.expiration=86400000


# Security logs
logging.level.org.springframework.security=TRACE


# Port serveur
server.port=8081
